<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Dashboard</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav><button id="logout">Logout</button></nav>
  <h1>Your Dashboard</h1>

  <section>
    <h2>Search Flights</h2>
    <input id="src" placeholder="From (code)">
    <input id="dest" placeholder="To (code)">
    <button id="search">Search</button>
    <table id="flightsTable">
      <tr>
        <th>Flight Code</th>
        <th>From</th>
        <th>To</th>
        <th>Status</th>
        <th>Seats</th>          <!-- NEW: header for available seats -->
        <th>Action</th>
      </tr>
    </table>
  </section>

  <section>
    <h2>Your Bookings</h2>
    <table id="bookingsTable">
      <tr><th>Ticket#</th><th>From</th><th>To</th><th>Date</th><th>Cancel</th></tr>
    </table>
  </section>

  <script>
    // Logout
    document.getElementById('logout').onclick = async () => {
      await fetch('/api/logout', { method:'POST' });
      window.location.href = 'login.html';
    };

    // Load user's current bookings
    async function loadBookings(){
      const res = await fetch('/api/bookings');
      const data = await res.json();
      const tbl = document.getElementById('bookingsTable');
      tbl.innerHTML = '<tr><th>Ticket#</th><th>From</th><th>To</th><th>Date</th><th>Cancel</th></tr>';
      data.forEach(b => {
        const r = tbl.insertRow();
        r.insertCell().innerText = b.TICKET_NUMBER;
        r.insertCell().innerText = b.SOURCE;
        r.insertCell().innerText = b.DESTINATION;
        r.insertCell().innerText = b.DATE_OF_BOOKING;
        const btn = document.createElement('button');
        btn.innerText = 'Cancel';
        btn.onclick = async () => {
          await fetch(`/api/bookings/${b.TICKET_NUMBER}`, {method:'DELETE'});
          loadBookings();
        };
        r.insertCell().appendChild(btn);
      });
    }

    // Search flights
    document.getElementById('search').onclick = async () => {
      const src = document.getElementById('src').value;
      const dest = document.getElementById('dest').value;
      let url = '/api/flights?';
      if (src) url += 'source=' + encodeURIComponent(src) + '&';
      if (dest) url += 'destination=' + encodeURIComponent(dest);
      const res = await fetch(url);
      const flights = await res.json();
      const table = document.getElementById('flightsTable');
      // Reset headers + body
      table.innerHTML = `
        <tr>
          <th>Flight Code</th><th>From</th><th>To</th>
          <th>Status</th><th>Seats</th><!-- NEW -->
          <th>Action</th>
        </tr>
      `;
      flights.forEach(f => {
        const row = table.insertRow();
        row.insertCell().innerText = f.FLIGHT_CODE;
        row.insertCell().innerText = f.SOURCE;
        row.insertCell().innerText = f.DESTINATION;
        row.insertCell().innerText = f.STATUS;
        row.insertCell().innerText = f.AVAILABLE_SEATS; // NEW: show seats
        const bookBtn = document.createElement('button');
        bookBtn.innerText = 'Book Now ✈️';
        bookBtn.onclick = () => {
          localStorage.setItem('flightToBook', f.FLIGHT_CODE);
          window.location.href = 'booking.html';
        };
        row.insertCell().appendChild(bookBtn);
      });
    };

    loadBookings(); // initial load of bookings
  </script>
</body>
</html>
